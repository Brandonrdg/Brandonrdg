<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
  <title id="title">Brandon Rodríguez — Bitácora de desarrollo</title>
  <desc id="desc">Estudiante de Ingeniería en Sistemas en Costa Rica. Software, hardware y videojuegos: FayeOS, VyB y proyectos con Godot. Perfil iniciado desde el repositorio de macu-dev, con una nueva tarjeta de presentación.</desc>
