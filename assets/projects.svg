<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="648" viewBox="0 0 1040 648" role="img" aria-labelledby="title desc">
  <title id="title">Proyectos de Brandon Rodríguez</title>
  <desc id="desc">Faye: asistente virtual de escritorio con C#, .NET, WPF y XAML. VyB: dispositivo portátil con RFID, Sub-GHz, pantalla OLED e infrarrojos, basado en ESP32 y .NET nanoFramework. Inventory Manager: aplicación de Windows Forms para gestionar productos con C# y SQLite. Las ilustraciones son esquemas de cada proyecto. Ping decorativo fijo en 300, con la barra pequeña roja y las otras dos grises. Perfil iniciado desde macu-dev.</desc>
