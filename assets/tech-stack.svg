  <title id="title">Tecnologías de Brandon Rodríguez</title>
  <desc id="desc">Panel negro con estilo de terminal. Software: C#, .NET, WPF, Java y Spring Boot. Bases de datos: SQLite y SQL Server. Web: HTML, CSS, JavaScript y Firebase. Videojuegos: Godot, GDScript, Unity y C#. Hardware: ESP32, .NET nanoFramework, GPIO, I²C y SPI. Herramientas: Git, Visual Studio, VS Code, Linux y DB Browser for SQLite. Ping decorativo de 300, con la barra pequeña roja y las dos mayores grises.</desc>
